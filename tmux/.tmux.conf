set -g default-terminal screen-256color

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
# Clipboard: tmux sends copies to the outer terminal via OSC 52, which works
# over SSH (iTerm2: enable "Applications in terminal may access clipboard").
# Also lets apps inside tmux (e.g. nvim "+y over SSH) set the clipboard.
set -s set-clipboard on
set -as terminal-features ',xterm*:clipboard'
# On macOS also pipe to pbcopy so local copies work without OSC 52.
if-shell 'uname | grep -q Darwin' \
  "bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'" \
  "bind-key -T copy-mode-vi y send -X copy-selection-and-cancel"

# this fixes delayed escape-key in nvim when ran inside tmux
# note that this might disable Meta key
set -s escape-time 0

# enable mouse scroll
setw -g mouse on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @dracula-show-powerline true
set -g @dracula-show-flags true
set -g @dracula-plugins "weather ssh-session"
set -g @dracula-show-ssh-only-when-connected true
set -g @dracula-show-ssh-session-port true
set -g @dracula-show-left-icon session
set -g @dracula-show-fahrenheit false
set -g @dracula-show-location true
set -g status-position top

# Initialize tmux plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

